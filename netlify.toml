[build]
  command = "npm run build"
  publish = "dist"

# Versión de Node para compilar en Netlify (Vite 6 requiere Node 18+).
# SUPABASE_URL y SUPABASE_ANON_KEY NO van aquí: se definen en Netlify →
# Site configuration → Environment variables (Vite las inyecta al compilar).
[build.environment]
  NODE_VERSION = "22"

# SPA fallback: cualquier ruta directa debe servir siempre index.html en vez
# de dar 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los archivos de /assets llevan hash en el nombre: se pueden cachear para
# siempre. index.html no, para que cada despliegue se vea al momento.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
