[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: react-router-dom maneja las rutas en el cliente, así que
# cualquier ruta directa (ej. recargar en /dispatcher/verificacion) debe
# servir siempre index.html en vez de dar 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
